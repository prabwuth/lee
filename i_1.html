<style>
    .yt-thumb-container {
        display: flex;
        flex-direction: column;
        align-items: center; /* จัดให้อยู่กึ่งกลาง */
        gap: 15px;           /* Gap เล็กน้อยตามที่ขอ */
        width: 100%;
    }
    .yt-thumb {
        width: 90%;          /* ความกว้าง 90% ตามที่ขอ */
        max-width: 900px;    /* กันภาพแตกเกินไปในจอใหญ่ (Optional) */
        height: auto;        /* รักษาสัดส่วนภาพ */
        object-fit: cover;
        border-radius: 8px;  /* ความมนเล็กน้อย */
        box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* เงาบางๆ ให้ดูสวย */
        display: block;
    }
</style>
<body>
<div class="yt-thumb-container">

    <img
