<script>

let players=[];

function onYouTubeIframeAPIReady(){

document.querySelectorAll("iframe").forEach((frame,i)=>{

players[i]=new YT.Player(frame);

});

}

let tag=document.createElement("script");
tag.src="https://www.youtube.com/iframe_api";
document.body.appendChild(tag);

let observer=new IntersectionObserver(entries=>{

entries.forEach(e=>{

let iframe=e.target.querySelector("iframe");

if(e.isIntersecting){

if(!iframe.src){
iframe.src=iframe.dataset.src;
}

}else{

iframe.src="";

}

});

},{threshold:0.7});

document.querySelectorAll(".yt-item").forEach(el=>{
observer.observe(el);
});

document.addEventListener("keydown",function(e){

if(e.code==="Space" || e.key==="k" || e.key==="K"){

e.preventDefault();

players.forEach(p=>{

if(p && p.getPlayerState){

let state=p.getPlayerState();

if(state===1){
p.pauseVideo();
}else{
p.playVideo();
}

}

});

}

if(e.key==="m" || e.key==="M"){

players.forEach(p=>{
if(p && p.isMuted){
if(p.isMuted()){
p.unMute();
}else{
p.mute();
}
}
});

}

});

</script>
