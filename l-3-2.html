<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>L-3-2</title>
<link rel="icon" href="https://img.icons8.com/scribby/50/l.png" type="image/x-icon">

<style>
body{margin:0;background:#000;}

.yt-stack-container{
height:100vh;
overflow-y:scroll;
scroll-snap-type:y mandatory;
}

.yt-item{
position:relative;
width:100%;
height:100vh;
scroll-snap-align:start;
background:#000;
}

.yt-item iframe{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
border:0;
}
</style>
</head>

<body>

<div class="yt-stack-container">

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/gGLFBN2yGn8?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/bDfXZyyZcko?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/P9nxE4n0fso?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/pIwZC6n7dHk?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/TM7Q6jvK7dE?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/ehpV7kEXZfM?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/3Z9xHkQpGJk?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/WQmP3c7pR8s?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/6Xc9V5F7l2Y?enablejsapi=1&mute=1"></iframe>
</div>

<div class="yt-item">
<iframe data-src="https://www.youtube.com/embed/yT7k3E6wJ3U?enablejsapi=1&mute=1"></iframe>
</div>

<!-- วิดีโออื่น ๆ จากไฟล์เดิมยังสามารถวางต่อรูปแบบนี้ได้ -->

</div>

<script>

let currentPlayer=null;

const observer=new IntersectionObserver((entries)=>{

entries.forEach((entry)=>{

const iframe=entry.target.querySelector("iframe");

if(entry.isIntersecting){

if(!iframe.src){
iframe.src=iframe.dataset.src+"&autoplay=1";
}

if(currentPlayer && currentPlayer!==iframe){
currentPlayer.contentWindow.postMessage(
'{"event":"command","func":"pauseVideo","args":""}',
'*'
);
}

iframe.contentWindow.postMessage(
'{"event":"command","func":"playVideo","args":""}',
'*'
);

currentPlayer=iframe;

}else{

iframe.contentWindow.postMessage(
'{"event":"command","func":"pauseVideo","args":""}',
'*'
);

}

});

},{threshold:0.6});

document.querySelectorAll(".yt-item").forEach(el=>{
observer.observe(el);
});

</script>

</body>
</html>
