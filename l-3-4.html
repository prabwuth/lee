<script>

let players=[];

function onYouTubeIframeAPIReady(){

document.querySelectorAll(".player").forEach((el,i)=>{

let id=el.dataset.id;

players[i]=new YT.Player(el,{
videoId:id,
playerVars:{
autoplay:0,
controls:0,
modestbranding:1,
rel:0,
playsinline:1
}
});

});

initObserver();

}

function initObserver(){

let observer=new IntersectionObserver(entries=>{

entries.forEach(entry=>{

let index=[...document.querySelectorAll(".yt-item")].indexOf(entry.target);

let player=players[index];

if(!player) return;

if(entry.isIntersecting){

player.playVideo();

}else{

player.pauseVideo();

}

});

},{threshold:0.7});

document.querySelectorAll(".yt-item").forEach(el=>{
observer.observe(el);
});

}

</script>
